<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vessel Volume Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;
        }
        .calculator {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .result {
            font-weight: bold;
            margin-top: 15px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Vessel Volume Calculator</h2>
        <div class="input-group">
            <label>Total Height of Vessel (cm):</label>
            <input type="number" id="totalHeight" step="0.1">
        </div>
        <div class="input-group">
            <label>Balance Height (cm):</label>
            <input type="number" id="balanceHeight" step="0.1">
        </div>
        <div class="input-group">
            <label>Diameter (cm):</label>
            <input type="number" id="diameter" step="0.1">
        </div>
        <div class="result" id="result"></div>
    </div>

    <script>
        function calculateVolume() {
            // Get input values
            const totalHeight = parseFloat(document.getElementById('totalHeight').value);
            const balanceHeight = parseFloat(document.getElementById('balanceHeight').value);
            const diameter = parseFloat(document.getElementById('diameter').value);

            // Validate inputs
            if (isNaN(totalHeight) || isNaN(balanceHeight) || isNaN(diameter)) {
                document.getElementById('result').textContent = 'Please fill all fields';
                return;
            }

            if (totalHeight <= 0 || diameter <= 0) {
                document.getElementById('result').textContent = 'Total height and diameter must be positive';
                return;
            }

            if (balanceHeight < 0) {
                document.getElementById('result').textContent = 'Balance height cannot be negative';
                return;
            }

            if (balanceHeight > totalHeight) {
                document.getElementById('result').textContent = 'Balance height cannot exceed total height';
                return;
            }

            // Calculate water height and volume
            const waterHeight = totalHeight - balanceHeight;
            const radius = diameter / 2;
            const volumeCm3 = Math.PI * Math.pow(radius, 2) * waterHeight;
            const volumeLiters = volumeCm3 / 1000;

            // Display result
            document.getElementById('result').textContent = 
                `Water Volume: ${volumeLiters.toFixed(2)} liters (Water height: ${waterHeight.toFixed(1)} cm)`;
        }

        // Add event listeners to all inputs
        document.getElementById('totalHeight').addEventListener('input', calculateVolume);
        document.getElementById('balanceHeight').addEventListener('input', calculateVolume);
        document.getElementById('diameter').addEventListener('input', calculateVolume);
    </script>

</body></html>
